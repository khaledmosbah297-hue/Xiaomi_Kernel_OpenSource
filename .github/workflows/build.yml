name: Build Kernel
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clone
      uses: actions/checkout@v4
      with:
        ref: sky-t-oss

    - name: Env
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc kmod cpio flex bison libssl-dev libelf-dev clang lld llvm git wget

    - name: Drivers
      run: |
        cat <<EOF >> arch/arm64/configs/gki_defconfig
        CONFIG_WIRELESS=y
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_CFG80211_WEXT=y
        CONFIG_MAC80211_LEDS=y
        CONFIG_NETDEVICES=y
        CONFIG_WLAN=y
        CONFIG_ATH_COMMON=y
        CONFIG
